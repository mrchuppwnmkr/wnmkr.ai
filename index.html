<style>
  :root {
    --ink:     #f4f7f6;
    --ink-dim: #b6c5c1;
    --accent:  #5eead4;
    --dark:    #0a0f0e;
    --line:    rgba(255,255,255,.22);
  }

  * { box-sizing: border-box; }
  html, body { height: 100%; }

  body {
    margin: 0;
    color: var(--ink);
    font-family: ui-sans-serif, -apple-system, "Segoe UI", Inter, Roboto, Helvetica, Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
    display: grid;
    place-items: center;
    padding: 2rem 1.5rem;
    position: relative;
    isolation: isolate;
  }

  /* ---- background photo ---- */
  body::before {
    content: "";
    position: fixed;
    inset: 0;
    z-index: -2;
    background: var(--dark) url("assets/hero-cluster-bottle.jpg") center / cover no-repeat;
  }

  /* ---- scrim: keeps text readable over the photo ---- */
  body::after {
    content: "";
    position: fixed;
    inset: 0;
    z-index: -1;
    background:
      radial-gradient(ellipse at 50% 42%, rgba(10,15,14,.30) 0%, rgba(10,15,14,.78) 68%, rgba(10,15,14,.92) 100%),
      linear-gradient(to bottom, rgba(10,15,14,.55) 0%, rgba(10,15,14,.20) 45%, rgba(10,15,14,.80) 100%);
  }

  main {
    width: 100%;
    max-width: 34rem;
    text-align: center;
    animation: rise .8s cubic-bezier(.2,.7,.3,1) both;
  }

  @keyframes rise {
    from { opacity: 0; transform: translateY(16px); }
    to   { opacity: 1; transform: none; }
  }

  @media (prefers-reduced-motion: reduce) {
    main { animation: none; }
    .dot { animation: none !important; }
  }

  .badge {
    display: inline-flex;
    align-items: center;
    gap: .55rem;
    font-size: .72rem;
    letter-spacing: .15em;
    text-transform: uppercase;
    color: var(--ink);
    background: rgba(10,15,14,.42);
    -webkit-backdrop-filter: blur(8px);
    backdrop-filter: blur(8px);
    border: 1px solid var(--line);
    border-radius: 999px;
    padding: .45rem .95rem;
    margin-bottom: 2rem;
  }

  .dot {
    width: 6px; height: 6px;
    border-radius: 50%;
    background: var(--accent);
    animation: pulse 2.4s ease-in-out infinite;
  }

  @keyframes pulse {
    0%,100% { opacity: 1;  box-shadow: 0 0 0 0 rgba(94,234,212,.5); }
    50%     { opacity: .45; box-shadow: 0 0 0 8px rgba(94,234,212,0); }
  }

  h1 {
    font-size: clamp(2.7rem, 12vw, 4.6rem);
    line-height: 1;
    letter-spacing: -.04em;
    font-weight: 650;
    margin: 0 0 1.2rem;
    text-shadow: 0 2px 30px rgba(0,0,0,.55);
  }

  h1 .tld { color: var(--accent); }

  p.lede {
    font-size: clamp(1.02rem, 3.4vw, 1.15rem);
    line-height: 1.65;
    color: var(--ink-dim);
    margin: 0 auto 2.5rem;
    max-width: 27rem;
    text-wrap: balance;
    text-shadow: 0 1px 16px rgba(0,0,0,.6);
  }

  .cta {
    display: inline-block;
    text-decoration: none;
    font-size: .95rem;
    font-weight: 550;
    color: var(--dark);
    background: var(--accent);
    padding: .82rem 1.7rem;
    border-radius: .6rem;
    transition: transform .15s ease, opacity .15s ease;
  }

  .cta:hover  { opacity: .9; transform: translateY(-1px); }
  .cta:active { transform: translateY(0); }
  .cta:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }

  footer {
    margin-top: 3.5rem;
    font-size: .78rem;
    color: var(--ink-dim);
    opacity: .7;
  }
</style>
